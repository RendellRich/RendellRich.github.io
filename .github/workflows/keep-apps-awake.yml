name: Keep Streamlit apps awake

on:
  schedule:
    # Every 6 hours. Streamlit Community Cloud sleeps apps after 12 hours without traffic.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Visit the apps
        run: python scripts/wake_apps.py
